name: Update Hall 22 from MaltaToday

on:
  schedule:
    # Two UTC hours cover Malta's CET/CEST offset. Repeated runs are idempotent.
    # The schedule expression, rather than delayed runner start time, chooses the mode.
    - cron: "7,27,47 8,9 * * *"
    - cron: "7,27,47 18,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Update mode (auto chooses from Malta time)
        type: choice
        options: [auto, live, completed]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hall22-daily-update
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Malta time
        id: clock
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$REQUESTED_MODE" = "live" ] || [ "$REQUESTED_MODE" = "completed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "7,27,47 8,9 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=live" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "7,27,47 18,19 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=completed" >> "$GITHUB_OUTPUT"
          elif [ "$REQUESTED_MODE" = "auto" ]; then
            MALTA_HOUR="$(TZ=Europe/Malta date +%H)"
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [ "$MALTA_HOUR" -lt 15 ]; then
              echo "mode=live" >> "$GITHUB_OUTPUT"
            else
              echo "mode=completed" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Node
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate structured daily update
        if: steps.clock.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPDATE_MODE: ${{ steps.clock.outputs.mode }}
        run: npm run update

      - name: Validate generated files
        if: steps.clock.outputs.run == 'true'
        run: npm run check

      - name: Commit update when content changed
        id: publish
        if: steps.clock.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/latest.js; then
            echo "No new MaltaToday trial update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "hall22-update[bot]"
          git config user.email "hall22-update[bot]@users.noreply.github.com"
          git add data/latest.js
          git commit -m "Update Hall 22 daily brief"
          git push origin master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.publish.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload updated static site
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy updated site to GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
